<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyctophile — Share. Connect. Express.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0B14;
  --panel:#12131F;
  --panel-2:#181A2A;
  --line:#262840;
  --violet:#8D7CFF;
  --violet-dim:#5B4FCE;
  --blue:#5FA8FF;
  --gold:#E8C888;
  --text:#EDEDF5;
  --text-dim:#9A9AB8;
  --text-faint:#5E6080;
  --danger:#FF6B7A;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--void); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
body{min-height:100vh; overflow-x:hidden;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14.5px; outline:none; width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--violet-dim);}
a{color:inherit; text-decoration:none;}
.serif{font-family:'Spectral',serif;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}

.stars{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, #fff 0, transparent 100%),
    radial-gradient(1px 1px at 65% 15%, #fff 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 85% 60%, #fff 0, transparent 100%),
    radial-gradient(1px 1px at 40% 80%, #fff 0, transparent 100%),
    radial-gradient(1px 1px at 10% 65%, #fff 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 25%, #fff 0, transparent 100%),
    radial-gradient(1px 1px at 55% 50%, #fff 0, transparent 100%),
    radial-gradient(1px 1px at 30% 10%, #fff 0, transparent 100%);
  background-repeat:no-repeat;
}

/* ---------- App shell ---------- */
#app{position:relative; z-index:1; min-height:100vh;}
.shell{display:flex; max-width:1180px; margin:0 auto; min-height:100vh;}
.sidebar{width:230px; flex-shrink:0; padding:26px 14px; display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh;}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 26px 10px;}
.brand .mark{width:30px; height:30px;}
.brand .word{font-family:'Spectral',serif; font-style:italic; font-size:21px; letter-spacing:.2px;}
.navlink{display:flex; align-items:center; gap:13px; padding:11px 12px; border-radius:11px; color:var(--text-dim); font-size:15px; font-weight:500; position:relative;}
.navlink:hover{background:var(--panel); color:var(--text);}
.navlink.active{background:var(--panel-2); color:var(--text);}
.navlink svg{width:20px; height:20px; flex-shrink:0;}
.navlink .badge{position:absolute; right:10px; background:var(--violet); color:#fff; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;}
.nav-user{margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border-radius:11px;}
.nav-user:hover{background:var(--panel);}
.avatar{border-radius:50%; object-fit:cover; background:linear-gradient(135deg,var(--violet),var(--blue)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff;}
.main{flex:1; min-width:0; padding:0 20px;}
.topbar{display:none;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:10px; font-weight:600; font-size:14px; transition:transform .15s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--violet),#6E5FE0); color:#fff;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--violet-dim);}
.btn-danger{background:rgba(255,107,122,.12); color:var(--danger); border:1px solid rgba(255,107,122,.3);}
.btn-sm{padding:6px 13px; font-size:13px; border-radius:8px;}
.btn-icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel-2); border:1px solid var(--line);}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}

/* ---------- Landing ---------- */
.landing{max-width:100%;}
.landing-nav{display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; padding:26px 24px;}
.hero{max-width:1100px; margin:0 auto; padding:60px 24px 90px; text-align:center; position:relative;}
.hero h1{font-family:'Spectral',serif; font-style:italic; font-size:clamp(42px,8vw,84px); font-weight:500; letter-spacing:.5px; background:linear-gradient(135deg,#fff 30%, var(--violet) 90%); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.05;}
.hero .tag{margin-top:18px; font-size:19px; color:var(--text-dim); font-weight:500;}
.hero p{max-width:560px; margin:20px auto 0; color:var(--text-faint); font-size:15.5px; line-height:1.65;}
.hero-actions{display:flex; gap:14px; justify-content:center; margin-top:34px;}
.crescent{width:150px; height:150px; margin:0 auto 10px; opacity:.9;}
.feature-grid{max-width:1100px; margin:0 auto; padding:0 24px 100px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.feature{padding:26px 20px; text-align:left;}
.feature .ic{font-size:22px; margin-bottom:14px;}
.feature h3{font-family:'Spectral',serif; font-size:19px; margin-bottom:8px;}
.feature p{font-size:13.5px; color:var(--text-faint); line-height:1.55;}
.footer{border-top:1px solid var(--line); padding:34px 24px; text-align:center; color:var(--text-faint); font-size:13px;}

/* ---------- Auth ---------- */
.authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.authcard{width:100%; max-width:400px; padding:36px 32px;}
.authcard h2{font-family:'Spectral',serif; font-style:italic; font-size:28px; margin-bottom:6px;}
.authcard .sub{color:var(--text-faint); font-size:13.5px; margin-bottom:26px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.authfoot{margin-top:20px; text-align:center; font-size:13.5px; color:var(--text-faint);}
.authfoot a{color:var(--violet); font-weight:600;}
.errmsg{background:rgba(255,107,122,.1); border:1px solid rgba(255,107,122,.3); color:var(--danger); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}

/* ---------- Feed / Post ---------- */
.feedwrap{max-width:560px; margin:0 auto; padding:24px 0 90px;}
.post{margin-bottom:20px; overflow:hidden;}
.post-head{display:flex; align-items:center; gap:11px; padding:14px 16px;}
.post-head .who{flex:1; min-width:0;}
.post-head .uname{font-weight:600; font-size:14.5px;}
.post-head .time{font-size:12px; color:var(--text-faint);}
.post-media{width:100%; background:#000; position:relative;}
.post-media img{width:100%; object-fit:cover; max-height:600px;}
.post-carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory;}
.post-carousel img{flex:0 0 100%; scroll-snap-align:start; max-height:600px; object-fit:cover;}
.dots{display:flex; gap:5px; justify-content:center; padding:8px 0 0;}
.dots span{width:5px; height:5px; border-radius:50%; background:var(--line);}
.post-actions{display:flex; align-items:center; gap:14px; padding:12px 16px 4px;}
.post-actions .act{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text-dim); font-weight:600;}
.post-actions .act svg{width:21px; height:21px;}
.post-actions .act.liked{color:var(--danger);}
.post-actions .act.saved{color:var(--gold);}
.post-actions .spacer{flex:1;}
.post-body{padding:6px 16px 4px;}
.post-body .cap{font-size:14.5px; line-height:1.5;}
.post-body .cap b{font-weight:600; margin-right:6px;}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.tag{font-size:12px; color:var(--blue); font-weight:600;}
.post-comments{padding:6px 16px 16px;}
.comment{display:flex; gap:9px; padding:7px 0;}
.comment .txt{font-size:13.5px; line-height:1.4;}
.comment .txt b{font-weight:600; margin-right:5px;}
.comment-meta{display:flex; gap:12px; margin-top:3px; font-size:11.5px; color:var(--text-faint); font-weight:600;}
.comment-input{display:flex; gap:8px; margin-top:8px; align-items:center;}
.comment-input input{flex:1; background:transparent; border:none; border-top:1px solid var(--line); border-radius:0; padding:12px 0 4px; font-size:13.5px;}
.see-more{font-size:13px; color:var(--text-faint); font-weight:600; cursor:pointer;}
.empty{text-align:center; padding:70px 20px; color:var(--text-faint);}
.empty .moon{font-size:34px; margin-bottom:14px;}

/* ---------- Grid (explore/profile) ---------- */
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:3px;}
.grid3 .cell{aspect-ratio:1; overflow:hidden; position:relative; background:var(--panel-2);}
.grid3 .cell img{width:100%; height:100%; object-fit:cover;}
.masonry{columns:3; column-gap:10px;}
.masonry .mitem{break-inside:avoid; margin-bottom:10px; border-radius:12px; overflow:hidden; position:relative;}
.masonry .mitem img{width:100%; display:block;}

/* ---------- Section headers ---------- */
.section-title{font-family:'Spectral',serif; font-style:italic; font-size:23px; margin:26px 0 16px;}
.pagehead{padding:24px 0 4px;}
.searchbar{position:relative; margin-bottom:18px;}
.searchbar input{padding-left:38px;}
.searchbar svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--text-faint);}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:16px;}
.chip{white-space:nowrap; padding:7px 15px; border-radius:20px; background:var(--panel); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--text-dim);}
.chip.active{background:var(--violet); color:#fff; border-color:var(--violet);}

/* ---------- Profile ---------- */
.profile-head{display:flex; gap:26px; align-items:flex-start; padding:30px 0 10px;}
.profile-stats{display:flex; gap:26px; margin:16px 0;}
.profile-stats .n{font-weight:700; font-size:16px;}
.profile-stats .l{color:var(--text-faint); font-size:12.5px;}
.tabs{display:flex; gap:4px; border-top:1px solid var(--line); margin-top:14px;}
.tabbtn{flex:1; padding:13px; text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.4px; color:var(--text-faint); border-top:2px solid transparent; margin-top:-1px;}
.tabbtn.active{color:var(--text); border-color:var(--violet);}

/* ---------- Modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(6,6,12,.72); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{width:100%; max-width:480px; max-height:88vh; overflow:auto; padding:26px;}
.modal h3{font-family:'Spectral',serif; font-size:21px; margin-bottom:18px;}
.modal-close{position:absolute; top:16px; right:16px;}
.drop{border:1.5px dashed var(--line); border-radius:12px; padding:34px 14px; text-align:center; color:var(--text-faint); font-size:13.5px; cursor:pointer;}
.drop:hover{border-color:var(--violet-dim);}
.preview-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0;}
.preview-grid .pv{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;}
.preview-grid .pv img{width:100%; height:100%; object-fit:cover;}
.preview-grid .pv .rm{position:absolute; top:4px; right:4px; width:20px; height:20px; background:rgba(0,0,0,.6); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px;}

/* ---------- Groups ---------- */
.group-card{padding:16px; display:flex; gap:14px; align-items:center; margin-bottom:12px;}
.group-cover{width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0; background:linear-gradient(135deg,var(--violet-dim),var(--blue));}
.priv-badge{font-size:10.5px; padding:2px 7px; border-radius:6px; background:var(--panel-2); color:var(--text-faint); font-weight:700;}

/* ---------- Notifications / Messages ---------- */
.notif{display:flex; gap:12px; padding:13px 4px; align-items:center; border-bottom:1px solid var(--line);}
.notif.unread{background:rgba(141,124,255,.05);}
.convo{display:flex; gap:12px; padding:13px 4px; align-items:center; border-bottom:1px solid var(--line);}
.msg-thread{display:flex; flex-direction:column; gap:8px; padding:16px 0; max-height:52vh; overflow-y:auto;}
.bubble{max-width:72%; padding:9px 13px; border-radius:16px; font-size:13.5px; line-height:1.4;}
.bubble.me{align-self:flex-end; background:linear-gradient(135deg,var(--violet),#6E5FE0); color:#fff; border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start; background:var(--panel-2); border-bottom-left-radius:4px;}
.presence-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:6px;vertical-align:middle;border:1px solid var(--panel)}
.presence-dot.online{background:#22c55e}.typing-label{font-size:12px;color:var(--text-faint);padding:0 4px;min-height:17px}

/* ---------- Admin ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px;}
.stat{padding:18px; text-align:center;}
.stat .num{font-family:'Spectral',serif; font-size:30px;}
.stat .lbl{font-size:12px; color:var(--text-faint); margin-top:4px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--text-faint); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; padding:9px 10px; border-bottom:1px solid var(--line);}
td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--panel); border:1px solid var(--line); padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:slidein .25s ease;}
@keyframes slidein{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}

.heart-pop{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;}
.heart-pop svg{width:90px; height:90px; animation:heartpop .7s ease forwards;}
@keyframes heartpop{0%{transform:scale(0); opacity:0;} 25%{transform:scale(1.15); opacity:1;} 45%{transform:scale(1);} 100%{transform:scale(1); opacity:0;}}

.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

/* ---------- Mobile ---------- */
.bottomnav{display:none;}
@media (max-width:880px){
  .sidebar{display:none;}
  .main{padding:0 14px;}
  .shell{display:block;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; position:sticky; top:0; background:rgba(10,11,20,.85); backdrop-filter:blur(10px); z-index:20;}
  .bottomnav{display:flex; position:fixed; bottom:0; left:0; right:0; background:rgba(15,16,26,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line); z-index:30; padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .bottomnav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text-faint); font-size:9.5px; font-weight:600; padding:4px;}
  .bottomnav a.active{color:var(--violet);}
  .bottomnav svg{width:22px; height:22px;}
  .feedwrap{padding-bottom:80px;}
  .feature-grid{grid-template-columns:1fr 1fr;}
  .profile-head{gap:16px;}
  main-content{padding-bottom:70px;}
}
</style>

/* ---------------- storage helpers ---------------- */
async function dbGet(key, fallback){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function dbSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); }
  catch(e){ console.error('storage error', key, e); }
}

/* in-memory cache of all tables, hydrated at boot */
let DB = {
  users:{}, posts:{}, comments:{}, likes:{}, follows:{}, saves:{},
  groups:{}, groupPosts:{}, notifications:{}, messages:{}, conversations:{}, reports:[]
};
let session = null; // {username}
let route = {view:'landing', params:{}};
let uiState = { exploreCat:'All', exploreQuery:'', profileTab:'posts', groupTab:'feed', authError:'' };

async function loadDB(){
  const [users,posts,comments,likes,follows,saves,groups,groupPosts,notifications,messages,conversations,reports] = await Promise.all([
    dbGet('db:users',{}), dbGet('db:posts',{}), dbGet('db:comments',{}), dbGet('db:likes',{}),
    dbGet('db:follows',{}), dbGet('db:saves',{}), dbGet('db:groups',{}), dbGet('db:groupPosts',{}),
    dbGet('db:notifications',{}), dbGet('db:messages',{}), dbGet('db:conversations',{}), dbGet('db:reports',[])
  ]);
  DB = {users,posts,comments,likes,follows,saves,groups,groupPosts,notifications,messages,conversations,reports};
}
async function save(table){ await dbSet('db:'+table, DB[table]); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function go(view, params={}){ route = {view, params}; renderApp(); window.scrollTo(0,0); if(view==='thread' && params.id){ subscribeToTyping(params.id); markConversationRead(params.id); } }

function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHTML(username, size=38){
  const u = DB.users[username];
  const name = u ? u.name : username;
  if(u && u.avatar){
    return `<img class="avatar" src="${u.avatar}" style="width:${size}px;height:${size}px" alt="">`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*0.38}px">${initials(name)}</div>`;
}

/* ---------------- image handling ---------------- */
function readAndResize(file, maxW=1000, quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')) return reject('Not an image');
    if(file.size > 15*1024*1024) return reject('File too large (max 15MB)');
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject('Could not read image');
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject('Could not read file');
    reader.readAsDataURL(file);
  });
}

/* ---------------- notifications ---------------- */
async function loadNotificationActorProfiles(actorIds=[]){
  if(!supabaseClient) return;
  const ids=[...new Set(actorIds.filter(Boolean))];
  const missing=ids.filter(id=>!Object.values(DB.users).some(user=>user.id===id));
  if(!missing.length) return;
  const {data:profiles,error}=await supabaseClient.from('profiles')
    .select('id,username,display_name,bio,avatar_url,created_at').in('id',missing);
  if(error) throw error;
  (profiles||[]).forEach(profile=>{
    const user=profileToUser(profile);
    DB.users[user.username]=user;
  });
}
async function loadSupabaseNotifications(){
  if(!supabaseClient || !session?.id) return;
  const {data:rows,error}=await supabaseClient.from('notifications')
    .select('id,user_id,actor_id,type,reference_id,is_read,created_at')
    .eq('user_id',session.id).order('created_at',{ascending:false}).limit(150);
  if(error) throw error;
  await loadNotificationActorProfiles((rows||[]).map(row=>row.actor_id));
  DB.notifications[session.username]=(rows||[]).map(row=>({
    id:row.id, type:row.type, fromUser:usernameForAuthId(row.actor_id),
    referenceId:row.reference_id, read:!!row.is_read, createdAt:new Date(row.created_at).getTime()
  }));
}
async function notify(toUser, type, fromUser, referenceId){
  // Real post likes/comments are notified by Supabase database triggers.
  // This avoids relying on a possibly stale local username-to-user-ID cache
  // and prevents duplicate notifications from both the browser and database.
  if(supabaseClient && session?.id) return;
  if(toUser===fromUser) return;
  if(!DB.notifications[toUser]) DB.notifications[toUser]=[];
  DB.notifications[toUser].unshift({id:uid('n'), type, fromUser, referenceId, read:false, createdAt:Date.now()});
  DB.notifications[toUser] = DB.notifications[toUser].slice(0,150);
  await save('notifications');
}
let notificationRealtimeChannel=null;
function subscribeToNotifications(){
  if(!supabaseClient || !session?.id) return;
  if(notificationRealtimeChannel) supabaseClient.removeChannel(notificationRealtimeChannel);
  notificationRealtimeChannel=supabaseClient.channel('nyctophile-notifications-'+session.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.id},async payload=>{
      const row=payload.new;
      try{ await loadNotificationActorProfiles([row.actor_id]); }
      catch(error){ console.error('Could not load notification profile:',error); }
      const item={id:row.id,type:row.type,fromUser:usernameForAuthId(row.actor_id),referenceId:row.reference_id,read:!!row.is_read,createdAt:new Date(row.created_at).getTime()};
      const list=(DB.notifications[session.username] ||= []);
      if(!list.some(n=>n.id===item.id)) list.unshift(item);
      toast((item.fromUser==='user_'+String(row.actor_id).slice(0,8)?'Someone':'@'+item.fromUser)+' '+(item.type==='like'?'liked your post ❤️':'commented on your post 💬'));
      renderApp();
    }).subscribe(status=>{if(status==='CHANNEL_ERROR') console.warn('Enable notifications in the supabase_realtime publication.');});
}
function unreadCount(){
  if(!session) return 0;
  const list = DB.notifications[session.username]||[];
  return list.filter(n=>!n.read).length;
}
function unreadMessageCount(){
  if(!session) return 0;
  return Object.values(DB.messages).flat().filter(m=>m.receiverId===session.username && !m.readAt).length;
}
async function markConversationDelivered(messageId){
  if(!session?.id || !supabaseClient) return;
  try{
    const deliveredAt=new Date().toISOString();
    const {error}=await supabaseClient.from('messages').update({delivered_at:deliveredAt})
      .eq('id',messageId).eq('receiver_id',session.id).is('delivered_at',null);
    if(error) throw error;
    for(const list of Object.values(DB.messages)){
      const message=list.find(m=>m.id===messageId);
      if(message && !message.deliveredAt) message.deliveredAt=deliveredAt;
    }
  }catch(err){ console.error('Could not mark message delivered:',err); }
}
async function markConversationRead(conversationId){
  if(!session?.id || !supabaseClient) return;
  try{
    const {error}=await supabaseClient.from('messages').update({read_at:new Date().toISOString()})
      .eq('conversation_id',conversationId).eq('receiver_id',session.id).is('read_at',null);
    if(error) throw error;
    (DB.messages[conversationId]||[]).forEach(m=>{if(m.receiverId===session.username && !m.readAt) m.readAt=new Date().toISOString();});
    renderApp();
  }catch(err){ console.error('Could not mark messages read:',err); }
}
let messageRealtimeChannel=null;
let presenceChannel=null, typingChannel=null, onlineUserIds=new Set(), typingTimer=null, typingStopTimer=null, someoneTyping=false;
function isUserOnline(username){ const id=DB.users[username]?.id; return !!id && onlineUserIds.has(id); }
function subscribeToPresence(){
  if(!supabaseClient || !session?.id) return;
  if(presenceChannel) supabaseClient.removeChannel(presenceChannel);
  presenceChannel=supabaseClient.channel('nyctophile-presence',{config:{presence:{key:session.id}}});
  presenceChannel.on('presence',{event:'sync'},()=>{
    onlineUserIds=new Set(Object.keys(presenceChannel.presenceState()||{}));
    if(route.view==='messages' || route.view==='thread') renderApp();
  }).subscribe(async status=>{
    if(status==='SUBSCRIBED') await presenceChannel.track({user_id:session.id,username:session.username,online_at:new Date().toISOString()});
  });
}
function subscribeToTyping(conversationId){
  if(!supabaseClient || !session?.id) return;
  if(typingChannel) supabaseClient.removeChannel(typingChannel);
  someoneTyping=false;
  typingChannel=supabaseClient.channel('nyctophile-typing-'+conversationId);
  typingChannel.on('broadcast',{event:'typing'},({payload})=>{
    if(payload?.user_id===session.id) return;
    someoneTyping=!!payload?.is_typing;
    const label=document.getElementById('typingLabel');
    if(label) label.textContent=someoneTyping?'Typing…':'';
  }).subscribe();
}
function sendTypingState(isTyping){
  if(!typingChannel || !session?.id) return;
  clearTimeout(typingStopTimer);
  if(isTyping){
    if(!typingTimer){ typingChannel.send({type:'broadcast',event:'typing',payload:{user_id:session.id,is_typing:true}}); typingTimer=setTimeout(()=>typingTimer=null,900); }
    typingStopTimer=setTimeout(()=>{typingChannel?.send({type:'broadcast',event:'typing',payload:{user_id:session.id,is_typing:false}});},1400);
  }else{ typingChannel.send({type:'broadcast',event:'typing',payload:{user_id:session.id,is_typing:false}}); }
}

function subscribeToMessageUpdates(){
  if(!supabaseClient || !session?.id) return;
  if(messageRealtimeChannel) supabaseClient.removeChannel(messageRealtimeChannel);
  messageRealtimeChannel=supabaseClient.channel('nyctophile-messages-'+session.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver_id=eq.'+session.id},async payload=>{
      try{
        await loadSupabaseMessages();
        const row=payload.new;
        const sender=usernameForAuthId(row.sender_id);
        await markConversationDelivered(row.id);
        if(route.view==='thread' && route.params.id===row.conversation_id){ await markConversationRead(row.conversation_id); }
        else { toast('New message from @'+sender+' 💬'); renderApp(); }
      }catch(err){ console.error('New message update failed:',err); }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'sender_id=eq.'+session.id},async()=>{
      try{ await loadSupabaseMessages(); if(route.view==='thread' || route.view==='messages') renderApp(); }
      catch(err){ console.error('Message status refresh failed:',err); }
    }).subscribe(status=>{ if(status==='CHANNEL_ERROR') console.warn('Supabase Realtime is not enabled for the messages table.'); });
}

/* ================= AUTH ================= */
function profileToUser(profile, email=''){
  const username = profile?.username || ('user_' + String(profile?.id||'').slice(0,8));
  return {
    username,
    name: profile?.display_name || username,
    email,
    avatar: profile?.avatar_url || null,
    bio: profile?.bio || '',
    createdAt: profile?.created_at ? new Date(profile.created_at).getTime() : Date.now(),
    role: 'member',
    id: profile?.id
  };
}
async function loadSupabaseProfile(authUser){
  const {data, error} = await supabaseClient.from('profiles')
    .select('id, username, display_name, bio, avatar_url, created_at')
    .eq('id', authUser.id).maybeSingle();
  if(error) throw error;
  if(!data) throw new Error('Your account was created, but its profile was not found. Check the Supabase signup trigger.');
  const user = profileToUser(data, authUser.email || '');
  DB.users[user.username] = user;
  DB.follows[user.username] ||= {followers:[], following:[]};
  session = {username:user.username, id:authUser.id};
  return user;
}
function showAuthError(message){
  uiState.authError = message || 'Something went wrong. Please try again.';
  renderApp();
}
async function handleSignup(e){
  e.preventDefault();
  const form=e.currentTarget;
  const button=form.querySelector('button[type="submit"]');
  const name=form.elements['name'].value.trim();
  const username=form.elements['username'].value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,'');
  const email=form.elements['email'].value.trim().toLowerCase();
  const pass=form.elements['password'].value;
  const confirm=form.elements['confirm'].value;
  uiState.authError='';
  if(!supabaseClient){ showAuthError('Cannot connect to Supabase. Check your internet connection and reload the page.'); return; }
  if(!name||!username||!email||!pass){ showAuthError('Please fill in every required field.'); return; }
  if(username.length<3){ showAuthError('Username must be at least 3 characters.'); return; }
  if(pass.length<6){ showAuthError('Password must be at least 6 characters.'); return; }
  if(pass!==confirm){ showAuthError("Passwords don't match."); return; }
  if(button){button.disabled=true;button.textContent='Creating account…';}
  try{
    const {data:existing, error:checkError}=await supabaseClient.from('profiles').select('id').eq('username',username).maybeSingle();
    if(checkError) throw checkError;
    if(existing) throw new Error('That username is already taken. Please choose another.');
    const {data,error}=await supabaseClient.auth.signUp({
      email,
      password:pass,
      options:{data:{username,display_name:name}}
    });
    if(error) throw error;
    if(data.user && data.session){
      await loadSupabaseProfile(data.user);
      await loadSupabasePosts();
      await loadSupabaseGroups();
      await loadSupabaseMessages();
      await loadSupabaseNotifications(); subscribeToNotifications();
      toast('Welcome to Nyctophile, '+name.split(' ')[0]+' 🌙');
      go('home');
    } else if(data.user){
      uiState.authError='Account created! Please check your email and confirm your address, then log in.';
      renderApp();
    } else {
      throw new Error('Supabase did not return an account. Please try again.');
    }
  }catch(err){
    console.error('NYCTOPHILE signup error:',err);
    showAuthError(err.message || 'Unable to create your account.');
  }finally{
    const current=document.querySelector('.authcard button[type="submit"]');
    if(current){current.disabled=false;current.textContent='Create account';}
  }
}
async function handleLogin(e){
  e.preventDefault();
  const form=e.currentTarget;
  const button=form.querySelector('button[type="submit"]');
  const identifier=form.elements['identifier'].value.trim();
  const pass=form.elements['password'].value;
  uiState.authError='';
  if(!supabaseClient){ showAuthError('Cannot connect to Supabase. Check your internet connection and reload the page.'); return; }
  if(button){button.disabled=true;button.textContent='Logging in…';}
  try{
    let email=identifier;
    if(!identifier.includes('@')){
      const {data,error}=await supabaseClient.from('profiles').select('id, username').eq('username',identifier.toLowerCase()).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('No account found with that username.');
      throw new Error('Please log in using the email address you registered with.');
    }
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.toLowerCase(),password:pass});
    if(error) throw error;
    await loadSupabaseProfile(data.user);
    await loadSupabasePosts();
    await loadSupabaseGroups();
    await loadSupabaseMessages();
    toast('Welcome back!');
    go('home');
  }catch(err){
    console.error('NYCTOPHILE login error:',err);
    showAuthError(err.message || 'Unable to log in.');
  }finally{
    const current=document.querySelector('.authcard button[type="submit"]');
    if(current){current.disabled=false;current.textContent='Log in';}
  }
}
async function handleLogout(){
  try{ if(supabaseClient) { const {error}=await supabaseClient.auth.signOut(); if(error) throw error; } }
  catch(err){ console.error('NYCTOPHILE logout error:',err); toast('Could not log out. Please try again.'); return; }
  session=null; go('landing');
}

/* ================= POSTS — Supabase ================= */
function dataUrlToBlob(dataUrl){
  const parts=dataUrl.split(',');
  const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
  const binary=atob(parts[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
async function loadSupabasePosts(){
  if(!supabaseClient) return;
  const {data:rows,error}=await supabaseClient.from('posts')
    .select('id,user_id,caption,image_url,image_urls,hashtags,category,created_at')
    .order('created_at',{ascending:false}).limit(100);
  if(error) throw error;
  const {data:profiles, error:profileError}=await supabaseClient.from('profiles')
    .select('id,username,display_name,avatar_url,bio');
  if(profileError) throw profileError;
  const byId={};
  (profiles||[]).forEach(p=>{ byId[p.id]=p; const u=profileToUser(p); DB.users[u.username]=u; });
  DB.posts={};
  (rows||[]).forEach(row=>{
    const profile=byId[row.user_id];
    const username=profile?.username || ('user_'+String(row.user_id).slice(0,8));
    const images=Array.isArray(row.image_urls)&&row.image_urls.length ? row.image_urls : (row.image_url?[row.image_url]:[]);
    DB.posts[row.id]={id:row.id,userId:username,images,caption:row.caption||'',hashtags:row.hashtags||[],category:row.category||'Other',createdAt:new Date(row.created_at).getTime(),groupId:null};
  });

  // Hydrate likes and comments from Supabase so they persist across devices.
  const [{data:likeRows,error:likeError},{data:commentRows,error:commentError}] = await Promise.all([
    supabaseClient.from('likes').select('post_id,user_id'),
    supabaseClient.from('comments').select('id,post_id,user_id,content,created_at')
  ]);
  if(likeError) throw likeError;
  if(commentError) throw commentError;
  DB.likes={};
  (likeRows||[]).forEach(row=>{
    const username=byId[row.user_id]?.username || ('user_'+String(row.user_id).slice(0,8));
    (DB.likes[row.post_id] ||= []).push(username);
  });
  DB.comments={};
  (commentRows||[]).forEach(row=>{
    const username=byId[row.user_id]?.username || ('user_'+String(row.user_id).slice(0,8));
    DB.comments[row.id]={id:row.id,postId:row.post_id,userId:username,content:row.content||'',createdAt:new Date(row.created_at).getTime(),parentId:null,likes:[]};
  });

  // Load real follower relationships from Supabase.
  const {data:followRows,error:followError}=await supabaseClient.from('follows')
    .select('follower_id,following_id');
  if(followError) throw followError;
  DB.follows={};
  Object.keys(DB.users).forEach(name=>DB.follows[name]={followers:[],following:[]});
  (followRows||[]).forEach(row=>{
    const follower=byId[row.follower_id]?.username;
    const following=byId[row.following_id]?.username;
    if(!follower || !following) return;
    (DB.follows[follower] ||= {followers:[],following:[]}).following.push(following);
    (DB.follows[following] ||= {followers:[],following:[]}).followers.push(follower);
  });
}
async function createPost({images, caption, hashtags, category, groupId}){
  if(!session?.id || !supabaseClient) throw new Error('Please log in before publishing.');
  if(groupId) throw new Error('Group posts are not connected to Supabase yet.');
  const uploaded=[];
  for(let i=0;i<images.length;i++){
    const blob=dataUrlToBlob(images[i]);
    const path=`${session.id}/${Date.now()}-${i}.jpg`;
    const {error:uploadError}=await supabaseClient.storage.from('post-images').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(uploadError) throw uploadError;
    const {data:publicData}=supabaseClient.storage.from('post-images').getPublicUrl(path);
    uploaded.push(publicData.publicUrl);
  }
  const payload={user_id:session.id,caption:caption||'',image_url:uploaded[0]||null,image_urls:uploaded,hashtags:hashtags||[],category:category||'Other'};
  const {data,error}=await supabaseClient.from('posts').insert(payload)
    .select('id,user_id,caption,image_url,image_urls,hashtags,category,created_at').single();
  if(error) throw error;
  const post={id:data.id,userId:session.username,images:uploaded,caption:data.caption||'',hashtags:data.hashtags||[],category:data.category||'Other',createdAt:new Date(data.created_at).getTime(),groupId:null};
  DB.posts[post.id]=post;
  DB.likes[post.id]=[];
  toast('Posted ✨');
  return post.id;
}
function postStore(post){ return post.groupId ? DB.groupPosts : DB.posts; }
async function toggleLike(postId, animEl){
  const post = DB.posts[postId] || DB.groupPosts[postId];
  if(!post || !session?.id) return;
  const arr = DB.likes[postId] || (DB.likes[postId]=[]);
  const i = arr.indexOf(session.username);
  try{
    if(DB.posts[postId]){
      if(i>=0){
        const {error}=await supabaseClient.from('likes').delete()
          .eq('post_id',postId).eq('user_id',session.id);
        if(error) throw error;
        arr.splice(i,1);
      }else{
        const {error}=await supabaseClient.from('likes').insert({post_id:postId,user_id:session.id});
        if(error) throw error;
        arr.push(session.username);
        notify(post.userId, 'like', session.username, postId);
        if(animEl) burstHeart(animEl);
      }
    }else{
      if(i>=0) arr.splice(i,1);
      else { arr.push(session.username); notify(post.userId, 'like', session.username, postId); if(animEl) burstHeart(animEl); }
      await save('likes');
    }
    renderApp();
  }catch(err){
    console.error('Like error:',err);
    toast('Could not update like: '+(err.message||'Please try again.'));
  }
}
function burstHeart(container){
  const pop = document.createElement('div');
  pop.className='heart-pop';
  pop.innerHTML = ICONS.heartFill.replace('currentColor','#FF6B7A');
  container.appendChild(pop);
  setTimeout(()=>pop.remove(), 700);
}
async function toggleSave(postId){
  const list = DB.saves[session.username] || (DB.saves[session.username]=[]);
  const i = list.indexOf(postId);
  if(i>=0) list.splice(i,1); else { list.push(postId); toast('Saved to your collection 🔖'); }
  await save('saves');
  renderApp();
}
async function deletePost(postId, isGroup){
  if(!confirm('Delete this post? This cannot be undone.')) return;
  if(isGroup) delete DB.groupPosts[postId]; else delete DB.posts[postId];
  delete DB.likes[postId];
  Object.keys(DB.comments).forEach(cid=>{ if(DB.comments[cid].postId===postId) delete DB.comments[cid]; });
  await save(isGroup?'groupPosts':'posts'); await save('likes'); await save('comments');
  toast('Post deleted');

/* ================= GROUPS ================= */
async function loadSupabaseGroups(){
  if(!supabaseClient || !session?.id) return;
  const [{data:groupRows,error:groupError},{data:memberRows,error:memberError}] = await Promise.all([
    supabaseClient.from('groups').select('id,name,description,cover_image_url,category,privacy,owner_id,created_at').order('created_at',{ascending:false}),
    supabaseClient.from('group_members').select('group_id,user_id,role,status,joined_at')
  ]);
  if(groupError) throw groupError;
  if(memberError) throw memberError;
  const memberIds=[...new Set((memberRows||[]).map(m=>m.user_id).filter(Boolean))];
  const missing=memberIds.filter(id=>!Object.values(DB.users).some(u=>u.id===id));
  if(missing.length){
    const {data:profiles,error:profileError}=await supabaseClient.from('profiles')
      .select('id,username,display_name,bio,avatar_url,created_at').in('id',missing);
    if(profileError) throw profileError;
    (profiles||[]).forEach(profile=>{const user=profileToUser(profile);DB.users[user.username]=user;});
  }
  const usernameById={};
  Object.values(DB.users).forEach(u=>{if(u.id) usernameById[u.id]=u.username;});
  const activeByGroup={},pendingByGroup={};
  (memberRows||[]).forEach(m=>{
    const username=usernameById[m.user_id]||(m.user_id===session.id?session.username:'user_'+String(m.user_id).slice(0,8));
    const item={username,role:m.role};
    if(m.status==='active') (activeByGroup[m.group_id] ||= []).push(item);
    if(m.status==='pending') (pendingByGroup[m.group_id] ||= []).push(username);
  });
  DB.groups={};
  (groupRows||[]).forEach(row=>{
    const ownerName=usernameById[row.owner_id] || (row.owner_id===session.id?session.username:'user_'+String(row.owner_id).slice(0,8));
    DB.groups[row.id]={id:row.id,name:row.name,description:row.description||'',image:row.cover_image_url||'',category:row.category||'Other',privacy:row.privacy,ownerId:ownerName,createdAt:new Date(row.created_at).getTime(),members:activeByGroup[row.id]||[],pendingRequests:pendingByGroup[row.id]||[]};
  });
}
async function createGroup({name, description, image, category, privacy}){
  if(!session?.id || !supabaseClient) throw new Error('Please log in before creating a group.');
  let coverUrl=null;
  if(image){
    const blob=dataUrlToBlob(image);
    const path=`groups/${session.id}/${Date.now()}.jpg`;
    const {error:uploadError}=await supabaseClient.storage.from('post-images').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(uploadError) throw uploadError;
    const {data:publicData}=supabaseClient.storage.from('post-images').getPublicUrl(path);
    coverUrl=publicData.publicUrl;
  }
  const {data,error}=await supabaseClient.from('groups').insert({
    name,description:description||'',cover_image_url:coverUrl,category:category||'Other',privacy:privacy||'public',owner_id:session.id
  }).select('id,name,description,cover_image_url,category,privacy,owner_id,created_at').single();
  if(error) throw error;
  await loadSupabaseGroups();
  toast('Group created 🌙');
  return data.id;
}
function isMember(group, username){ return group.members.some(m=>m.username===username); }
function memberRole(group, username){ const m=group.members.find(m=>m.username===username); return m?m.role:null; }
async function groupUserId(username){
  const cached=DB.users[username]?.id;
  if(cached) return cached;
  const {data,error}=await supabaseClient.from('profiles').select('id,username,display_name,bio,avatar_url,created_at').eq('username',username).maybeSingle();
  if(error) throw error;
  if(!data) return null;
  const user=profileToUser(data); DB.users[user.username]=user; return user.id;
}
async function joinGroup(id){
  try{
    const g=DB.groups[id]; if(!g||!session?.id) return;
    if(isMember(g,session.username)){toast('You are already a member.');return;}
    const status=g.privacy==='private'?'pending':'active';
    const {error}=await supabaseClient.from('group_members').insert({group_id:id,user_id:session.id,role:'member',status});
    if(error) throw error;
    await loadSupabaseGroups(); renderApp();
    toast(status==='pending'?'Join request sent.':'Joined '+g.name);
  }catch(error){console.error(error);toast(error.message||'Could not join this group.');}
}
async function leaveGroup(id){
  try{
    const {error}=await supabaseClient.from('group_members').delete().eq('group_id',id).eq('user_id',session.id);
    if(error) throw error;
    await loadSupabaseGroups(); renderApp(); toast('You left the group.');
  }catch(error){console.error(error);toast(error.message||'Could not leave this group.');}
}
async function approveRequest(gid, username, approve){
  try{
    const userId=await groupUserId(username); if(!userId) throw new Error('Could not find that user.');
    let result;
    if(approve) result=await supabaseClient.from('group_members').update({status:'active'}).eq('group_id',gid).eq('user_id',userId).eq('status','pending');
    else result=await supabaseClient.from('group_members').delete().eq('group_id',gid).eq('user_id',userId).eq('status','pending');
    if(result.error) throw result.error;
    await loadSupabaseGroups(); renderApp(); toast(approve?'Membership approved.':'Request declined.');
  }catch(error){console.error(error);toast(error.message||'Could not update request.');}
}
async function removeMember(gid, username, ban=false){
  try{
    const userId=await groupUserId(username); if(!userId) throw new Error('Could not find that user.');
    const {error}=await supabaseClient.from('group_members').delete().eq('group_id',gid).eq('user_id',userId);
    if(error) throw error;
    await loadSupabaseGroups(); renderApp(); toast(ban?username+' was removed from the group.':username+' was removed.');
  }catch(error){console.error(error);toast(error.message||'Could not remove member.');}
}
async function setModerator(gid, username, role){
  try{
    const userId=await groupUserId(username); if(!userId) throw new Error('Could not find that user.');
    const {error}=await supabaseClient.from('group_members').update({role}).eq('group_id',gid).eq('user_id',userId);
    if(error) throw error;
    await loadSupabaseGroups(); renderApp(); toast('Member role updated.');
  }catch(error){console.error(error);toast(error.message||'Could not update member role.');}
}
async function addGroupMember(gid){
  try{
    const input=document.getElementById('add-group-member-'+gid);
    const username=(input?.value||'').trim().replace(/^@/,'').toLowerCase();
    if(!username){toast('Enter a username first.');return;}

/* ================= MESSAGES — Supabase ================= */
function conversationIdFor(a,b){ return [a,b].sort().join('__'); }
function usernameForAuthId(authId){
  return Object.values(DB.users).find(u=>u.id===authId)?.username || ('user_'+String(authId).slice(0,8));
}
async function loadSupabaseMessages(){
  if(!supabaseClient || !session?.id) return;
  const {data:rows,error}=await supabaseClient.from('messages')
    .select('id,conversation_id,sender_id,receiver_id,content,created_at,delivered_at,read_at')
    .or(`sender_id.eq.${session.id},receiver_id.eq.${session.id}`)
    .order('created_at',{ascending:true});
  if(error) throw error;
  DB.messages={};
  DB.conversations={};
  (rows||[]).forEach(row=>{
    const sender=usernameForAuthId(row.sender_id);
    const receiver=usernameForAuthId(row.receiver_id);
    const id=row.conversation_id || conversationIdFor(sender,receiver);
    const participants=[sender,receiver];
    if(!DB.conversations[id]) DB.conversations[id]={id,participants,updatedAt:new Date(row.created_at).getTime()};
    DB.conversations[id].updatedAt=new Date(row.created_at).getTime();
    (DB.messages[id] ||= []).push({id:row.id,senderId:sender,receiverId:receiver,content:row.content,createdAt:new Date(row.created_at).getTime(),deliveredAt:row.delivered_at,readAt:row.read_at});
  });
}
async function openConversation(target){
  if(!session?.id || !supabaseClient){ toast('Please log in to send messages.'); return; }
  const targetUser=DB.users[target];
  if(!targetUser?.id){ toast('This user profile could not be found.'); return; }
  const id=conversationIdFor(session.username,target);
  DB.conversations[id] ||= {id,participants:[session.username,target],updatedAt:Date.now()};
  DB.messages[id] ||= [];
  try{
    const {data:rows,error}=await supabaseClient.from('messages').select('id,conversation_id,sender_id,receiver_id,content,created_at,delivered_at,read_at').eq('conversation_id',id).order('created_at',{ascending:true});
    if(error) throw error;
    DB.messages[id]=(rows||[]).map(row=>({id:row.id,senderId:usernameForAuthId(row.sender_id),receiverId:usernameForAuthId(row.receiver_id),content:row.content,createdAt:new Date(row.created_at).getTime(),deliveredAt:row.delivered_at,readAt:row.read_at}));
    go('thread',{id});
  }catch(err){ console.error('Could not open conversation:',err); toast('Could not load this conversation.'); }
}
async function sendMessage(convoId, text){
  const content=(text||'').trim();
  if(!content) return;
  const conv=DB.conversations[convoId];
  if(!conv || !session?.id || !supabaseClient) return;
  const to=conv.participants.find(p=>p!==session.username);
  const receiver=DB.users[to];
  if(!receiver?.id){ toast('Recipient account could not be found.'); return; }
  try{
    const {data,error}=await supabaseClient.from('messages').insert({
      conversation_id:convoId,sender_id:session.id,receiver_id:receiver.id,content
    }).select('id,conversation_id,sender_id,receiver_id,content,created_at,delivered_at,read_at').single();
    if(error) throw error;
    (DB.messages[convoId] ||= []).push({id:data.id,senderId:session.username,receiverId:to,content:data.content,createdAt:new Date(data.created_at).getTime(),deliveredAt:data.delivered_at,readAt:data.read_at});
    conv.updatedAt=new Date(data.created_at).getTime();
    renderApp();
  }catch(err){ console.error('NYCTOPHILE send message error:',err); toast(err.message || 'Message could not be sent.'); }
}

}

/* ---- Home feed ---- */
function renderHome(){
  const following = DB.follows[session.username]?.following || [];
  let posts = Object.values(DB.posts).sort((a,b)=>b.createdAt-a.createdAt);
  posts.sort((a,b)=>{
    const af = following.includes(a.userId)?1:0, bf = following.includes(b.userId)?1:0;
    if(af!==bf) return bf-af;
    return b.createdAt-a.createdAt;
  });
  return `<div class="feedwrap">
    ${posts.length===0?`
      <div class="empty"><div class="moon">🌙</div><div style="font-size:16px;color:var(--text)">No posts yet</div><div style="margin-top:6px">Be the first to share something.</div>
      <button class="btn btn-primary" style="margin-top:18px" onclick="openCreatePost()">Create a post</button></div>
    `: posts.map(postCardHTML).join('')}
  </div>`;
}

      <div class="field"><label>Username</label><input name="username" value="${esc(u.username)}" required></div>
      <div class="field"><label>Bio</label><textarea name="bio" rows="3">${esc(u.bio||'')}</textarea></div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px" type="submit">Save changes</button>
    </form>

async function handleEditProfile(e){
  e.preventDefault();
  const form=e.currentTarget;
  const button=form.querySelector('button[type="submit"]');
  const currentUser=DB.users[session?.username];
  if(!session?.id || !supabaseClient || !currentUser){ toast('Please log in again before editing your profile.'); return; }
  const newName=form.elements['name'].value.trim();
  const newUsername=form.elements['username'].value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,'');
  const bio=form.elements['bio'].value.trim();
  const file=form.elements['avatar'].files[0];
  if(!newName || newUsername.length<3){ toast('Enter a name and a username with at least 3 characters.'); return; }
  if(button){button.disabled=true;button.textContent='Saving…';}
  try{
    if(newUsername!==session.username){
      const {data:existing,error:checkError}=await supabaseClient.from('profiles')
        .select('id').eq('username',newUsername).neq('id',session.id).maybeSingle();
      if(checkError) throw checkError;
      if(existing) throw new Error('That username is already taken.');
    }

    let avatarUrl=currentUser.avatar || null;
    if(file){
      if(!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const path=`${session.id}/avatar-${Date.now()}.${ext}`;
      const {error:uploadError}=await supabaseClient.storage.from('post-images')
        .upload(path,file,{contentType:file.type,upsert:false});
      if(uploadError) throw uploadError;
      const {data:publicData}=supabaseClient.storage.from('post-images').getPublicUrl(path);
      avatarUrl=publicData.publicUrl;
    }

    const {data:updated,error:updateError}=await supabaseClient.from('profiles')
      .update({username:newUsername,display_name:newName,bio,avatar_url:avatarUrl})
      .eq('id',session.id)
      .select('id,username,display_name,bio,avatar_url,created_at').single();
    if(updateError) throw updateError;

    const oldUsername=session.username;
    const updatedUser=profileToUser(updated,currentUser.email||'');
    if(oldUsername!==newUsername){
      delete DB.users[oldUsername];
      session.username=newUsername;
    }
    DB.users[newUsername]=updatedUser;
    await loadSupabasePosts();
    toast('Profile saved successfully!');
    go('profile',{username:session.username});
  }catch(err){
    console.error('NYCTOPHILE profile update error:',err);
    toast('Could not save profile: '+(err.message||'Please try again.'));
  }finally{
    if(button){button.disabled=false;button.textContent='Save changes';}
  }
}
function renderSaved(){
  const ids = DB.saves[session.username]||[];
  const posts = ids.map(id=>DB.posts[id]).filter(Boolean).sort((a,b)=>b.createdAt-a.createdAt);
  return `<div class="pagehead"><div class="section-title">Saved</div></div>
  <div class="feedwrap" style="padding-top:0">
  ${posts.length? posts.map(postCardHTML).join('') : `<div class="empty"><div class="moon">🔖</div>Nothing saved yet.</div>`}
  </div>`;
}

/* ---- Notifications ---- */
async function openNotificationPost(postId){
  if(!postId){ toast('This notification has no linked post.'); return; }
  let post=DB.posts[postId] || DB.groupPosts[postId];
  if(!post && supabaseClient){
    try{
      const {data:row,error}=await supabaseClient.from('posts')
        .select('id,user_id,caption,image_url,image_urls,hashtags,category,created_at')
        .eq('id',postId).maybeSingle();
      if(error) throw error;
      if(row){
        const {data:profile,error:profileError}=await supabaseClient.from('profiles')
          .select('id,username,display_name,avatar_url,bio').eq('id',row.user_id).maybeSingle();
        if(profileError) throw profileError;
        if(profile){ const user=profileToUser(profile); DB.users[user.username]=user; }
        const username=profile?.username || ('user_'+String(row.user_id).slice(0,8));
        const images=Array.isArray(row.image_urls)&&row.image_urls.length ? row.image_urls : (row.image_url?[row.image_url]:[]);
        post=DB.posts[postId]={id:row.id,userId:username,images,caption:row.caption||'',hashtags:row.hashtags||[],category:row.category||'Other',createdAt:new Date(row.created_at).getTime(),groupId:null};
      }
    }catch(error){ console.error('Could not open notification post:',error); toast('Could not load that post. Please try again.'); return; }
  }
  if(!post){ toast('This post may have been deleted.'); return; }
  go('home');
  setTimeout(()=>{
    const card=[...document.querySelectorAll('[data-post]')].find(el=>el.getAttribute('data-post')===String(postId));
    if(card){
      card.scrollIntoView({behavior:'smooth',block:'center'});
      card.style.outline='2px solid var(--violet)';
      card.style.boxShadow='0 0 0 5px rgba(141,124,255,.16)';
      setTimeout(()=>{card.style.outline='';card.style.boxShadow='';},2400);
    }else{ toast('Post loaded, but it is not currently visible in your feed.'); }
  },80);
}
function renderNotifications(){
  const list = DB.notifications[session.username]||[];
  const unread=list.filter(n=>!n.read);
  unread.forEach(n=>n.read=true);
  if(unread.length && supabaseClient && session?.id){
    supabaseClient.from('notifications').update({is_read:true}).eq('user_id',session.id).eq('is_read',false)
      .then(({error})=>{if(error) console.error('Could not mark notifications read:',error);});
  }else if(unread.length){ save('notifications'); }
  const msg = {like:'liked your post', comment:'commented on your post', follow:'started following you',
    group_request:'requested to join your group', group_approved:'approved your group request'};
  return `<div class="pagehead"><div class="section-title">Notifications</div></div>
  <div class="card" style="padding:4px 14px">
  ${list.length? list.map(n=>`
    <div class="notif ${n.read?'':'unread'}" ${n.referenceId?`role="button" tabindex="0" onclick="openNotificationPost('${esc(String(n.referenceId))}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openNotificationPost('${esc(String(n.referenceId))}')}" style="cursor:pointer"`:''}>
      ${avatarHTML(n.fromUser,36)}
      <div style="flex:1;font-size:13.5px"><b>${esc(DB.users[n.fromUser]?.name||n.fromUser)}</b> ${msg[n.type]||n.type}<div class="faint" style="font-size:11.5px;margin-top:2px">${timeAgo(n.createdAt)}${n.referenceId? ' · View post':''}</div></div>
    </div>`).join('') : `<div class="empty"><div class="moon">🔔</div>No notifications yet.</div>`}
  </div>`;
}

/* ---- Messages ---- */
function renderMessagesList(){
  const convos = Object.values(DB.conversations).filter(c=>c.participants.includes(session.username)).sort((a,b)=>b.updatedAt-a.updatedAt);
  return `<div class="pagehead"><div class="section-title">Messages</div></div>
  <div class="card" style="padding:4px 14px">
  ${convos.length? convos.map(c=>{
    const other = c.participants.find(p=>p!==session.username);
    const msgs = DB.messages[c.id]||[];
    const last = msgs[msgs.length-1];
    return `<div class="convo" style="cursor:pointer" onclick="go('thread',{id:'${c.id}'})">
      ${avatarHTML(other,42)}
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px"><span class="presence-dot ${isUserOnline(other)?'online':''}"></span>${esc(DB.users[other]?.name||other)}</div>
      <div class="faint" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?esc(last.content):'Start the conversation'}</div></div>
      <div class="faint" style="font-size:11px">${last?timeAgo(last.createdAt):''}</div>
    </div>`;
  }).join('') : `<div class="empty"><div class="moon">💬</div>No conversations yet.</div>`}
  </div>`;
}
function renderThread(id){
  const conv = DB.conversations[id];
  if(!conv) return `<div class="empty">Conversation not found.</div>`;
  const other = conv.participants.find(p=>p!==session.username);
  const msgs = DB.messages[id]||[];
  return `<div class="pagehead" style="display:flex;align-items:center;gap:12px">
    <button class="btn-icon" onclick="go('messages')">←</button>
    ${avatarHTML(other,36)}<div style="font-weight:600;flex:1"><span class="presence-dot ${isUserOnline(other)?'online':''}"></span>${esc(DB.users[other]?.name||other)}<div class="faint" style="font-size:11px;font-weight:400">${isUserOnline(other)?'Online':'Offline'}</div></div>
  </div>
  <div class="card" style="padding:14px">
    <div class="msg-thread">
      ${msgs.length? msgs.map(m=>`<div class="message-row" style="display:flex;flex-direction:column;align-items:${m.senderId===session.username?'flex-end':'flex-start'};margin:6px 0"><div class="bubble ${m.senderId===session.username?'me':'them'}">${esc(m.content)}</div>${m.senderId===session.username?`<div class="faint" style="font-size:10px;margin:2px 6px">${m.readAt?'✓✓ Seen':m.deliveredAt?'✓✓ Delivered':'✓ Sent'}</div>`:''}</div>`).join('') : `<div class="empty faint" style="padding:30px">Say hello 👋</div>`}
    </div>
    <div id="typingLabel" class="typing-label">${someoneTyping?'Typing…':''}</div>
    <div class="comment-input" style="margin-top:6px">
      <input id="threadInput" placeholder="Message…" oninput="sendTypingState(this.value.trim().length>0)" onkeydown="if(event.key==='Enter'){sendTypingState(false);sendMessage('${id}',this.value);this.value='';}">
      <button class="btn btn-primary btn-sm" onclick="const i=document.getElementById('threadInput'); sendMessage('${id}',i.value); i.value='';">Send</button>
    </div>
  </div>`;
}

/* ---- Admin ---- */
function renderAdmin(){
  if(!isAdmin()) return `<div class="empty">You don't have access to this page.</div>`;
  const users = Object.values(DB.users);
  const posts = Object.values(DB.posts).length + Object.values(DB.groupPosts).length;
  const comments = Object.values(DB.comments).length;
  const likes = Object.values(DB.likes).reduce((s,a)=>s+a.length,0);
  const groups = Object.values(DB.groups).length;
  const openReports = DB.reports.filter(r=>r.status==='open');
  return `<div class="pagehead"><div class="section-title">Admin dashboard</div></div>
  <div class="stat-grid">
    <div class="card stat"><div class="num">${users.length}</div><div class="lbl">Total users</div></div>
    <div class="card stat"><div class="num">${posts}</div><div class="lbl">Total posts</div></div>
    <div class="card stat"><div class="num">${groups}</div><div class="lbl">Total groups</div></div>
    <div class="card stat"><div class="num">${comments}</div><div class="lbl">Total comments</div></div>
    <div class="card stat"><div class="num">${likes}</div><div class="lbl">Total likes</div></div>
    <div class="card stat"><div class="num">${openReports.length}</div><div class="lbl">Open reports</div></div>
  </div>
  <div class="section-title" style="font-size:17px">Users</div>
  <div class="card" style="padding:10px;overflow-x:auto">
  <table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
  ${users.map(u=>`<tr>
    <td style="display:flex;align-items:center;gap:8px">${avatarHTML(u.username,26)}${esc(u.name)} <span class="faint">@${u.username}</span></td>
    <td class="faint">${esc(u.email)}</td><td>${u.role}</td>
    <td>${u.suspended?'<span style="color:var(--danger)">Suspended</span>':'Active'}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn btn-ghost btn-sm" onclick="toggleSuspend('${u.username}')">${u.suspended?'Unsuspend':'Suspend'}</button>
      ${u.role!=='admin'?`<button class="btn btn-danger btn-sm" onclick="adminDeleteUser('${u.username}')">Delete</button>`:''}
    </td>
  </tr>`).join('')}
  </tbody></table></div>

  <div class="section-title" style="font-size:17px">Reports</div>
  <div class="card" style="padding:10px;overflow-x:auto">
  <table><thead><tr><th>Type</th><th>Target</th><th>Reason</th><th>Reporter</th><th>Status</th><th></th></tr></thead><tbody>
  ${DB.reports.length? DB.reports.slice().reverse().map(r=>`<tr>
    <td>${r.type}</td><td class="faint">${esc(r.targetId)}</td><td>${esc(r.reason)}</td><td>@${r.reporterId}</td>
    <td>${r.status}</td>
    <td style="white-space:nowrap">
    ${r.status==='open'?`<button class="btn btn-ghost btn-sm" onclick="resolveReport('${r.id}','dismissed')">Dismiss</button>
    ${r.type==='post'?`<button class="btn btn-danger btn-sm" onclick="adminDeletePost('${r.targetId}',false); resolveReport('${r.id}','removed')">Remove</button>`:''}`:''}
    </td>
  </tr>`).join('') : `<tr><td colspan="6" class="faint" style="text-align:center;padding:20px">No reports.</td></tr>`}
  </tbody></table></div>`;
}

/* ================= MODALS ================= */
let modalRoot;
function closeModal(){ if(modalRoot) modalRoot.remove(); modalRoot=null; }
function openModal(html){
  closeModal();
  modalRoot = document.createElement('div');
  modalRoot.className='modal-bg';
  modalRoot.onclick = (e)=>{ if(e.target===modalRoot) closeModal(); };
  modalRoot.innerHTML = `<div class="card modal" onclick="event.stopPropagation()"><button class="btn-icon modal-close" onclick="closeModal()">✕</button>${html}</div>`;
  document.body.appendChild(modalRoot);
}

let createPostImages = [];
function openCreatePost(groupId){
  createPostImages = [];
  openModal(`
    <h3>Create post${groupId?' · '+esc(DB.groups[groupId].name):''}</h3>
    <input type="hidden" id="cp-group" value="${groupId||''}">
    <div class="drop" onclick="document.getElementById('cp-file').click()">
      📷 Click to upload photos, or drag & drop<br><span class="faint">JPG, PNG, WEBP, GIF — up to 15MB each</span>
    </div>
    <input id="cp-file" type="file" accept="image/*" multiple style="display:none" onchange="handleCPFiles(event)">
    <div class="preview-grid" id="cp-preview"></div>
    <div class="field"><label>Caption</label><textarea id="cp-caption" rows="3" placeholder="Write a caption…"></textarea></div>
    <div class="field"><label>Hashtags (comma separated)</label><input id="cp-tags" placeholder="night, longexposure, city"></div>
    <div class="field"><label>Category</label><select id="cp-cat">${CATEGORIES.map(c=>`<option value="${c}">${CAT_EMOJI[c]} ${c}</option>`).join('')}</select></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitCreatePost()">Publish</button>
  `);
}
async function handleCPFiles(e){
  const files = Array.from(e.target.files).slice(0, 10-createPostImages.length);
  for(const f of files){
    try{ const dataUrl = await readAndResize(f); createPostImages.push(dataUrl); }
    catch(err){ toast(typeof err==='string'?err:'Could not process image'); }
  }
  renderCPPreview();
}
function renderCPPreview(){
  document.getElementById('cp-preview').innerHTML = createPostImages.map((im,i)=>`
    <div class="pv"><img src="${im}"><div class="rm" onclick="createPostImages.splice(${i},1);renderCPPreview()">✕</div></div>`).join('');
}
async function submitCreatePost(){
  if(createPostImages.length===0){ toast('Add at least one photo'); return; }
  const groupId = document.getElementById('cp-group').value || null;
  const caption = document.getElementById('cp-caption').value;
  const hashtags = document.getElementById('cp-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const category = document.getElementById('cp-cat').value;
  const submitButton=document.querySelector('#modal button.btn-primary');
  if(submitButton){submitButton.disabled=true;submitButton.textContent='Publishing…';}
  try{
    const id = await createPost({images:createPostImages, caption, hashtags, category, groupId});
    createPostImages=[];
    closeModal();
    go('home');
  }catch(err){
    console.error('NYCTOPHILE publish error:',err);
    toast(err.message||'Could not publish post.');
    if(submitButton){submitButton.disabled=false;submitButton.textContent='Publish';}
  }
}

let createGroupImage = null;
function openCreateGroup(){
  createGroupImage = null;
  openModal(`
    <h3>Create a group</h3>
    <div class="field"><label>Cover image</label>
      <div class="drop" onclick="document.getElementById('cg-file').click()" id="cg-drop">🖼 Click to upload a cover image</div>
      <input id="cg-file" type="file" accept="image/*" style="display:none" onchange="handleCGFile(event)">
    </div>
    <div class="field"><label>Group name</label><input id="cg-name" placeholder="Night Photography"></div>
    <div class="field"><label>Description</label><textarea id="cg-desc" rows="2" placeholder="Share your best night photography and discuss techniques."></textarea></div>
    <div class="field"><label>Category</label><select id="cg-cat">${CATEGORIES.map(c=>`<option value="${c}">${CAT_EMOJI[c]} ${c}</option>`).join('')}</select></div>
    <div class="field"><label>Privacy</label><select id="cg-priv"><option value="public">🌐 Public — anyone can find and join</option><option value="private">🔒 Private — request to join</option></select></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitCreateGroup()">Create group</button>
  `);
}
async function handleCGFile(e){
  const f = e.target.files[0]; if(!f) return;
  try{ createGroupImage = await readAndResize(f, 500, .75); document.getElementById('cg-drop').innerHTML = `<img src="${createGroupImage}" style="max-height:100px;border-radius:8px">`; }
  catch(err){ toast('Could not process image'); }
}
async function submitCreateGroup(){
  const name = document.getElementById('cg-name').value.trim();
  if(!name){ toast('Group needs a name'); return; }
  const button=document.querySelector('.modal button.btn-primary');
  if(button){button.disabled=true;button.textContent='Creating…';}
  try{
    const description = document.getElementById('cg-desc').value.trim();
    const category = document.getElementById('cg-cat').value;
    const privacy = document.getElementById('cg-priv').value;
    const id = await createGroup({name, description, image:createGroupImage, category, privacy});
    closeModal();
    go('groupDetail',{id});
  }catch(err){
    console.error('Create group error:',err);
    toast(err.message||'Could not create group.');
    if(button){button.disabled=false;button.textContent='Create group';}
  }
}

function openReport(type, targetId){
  openModal(`
    <h3>Report ${type}</h3>
    <div class="field"><label>Reason</label><select id="rep-reason">${REPORT_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Additional details (optional)</label><textarea id="rep-details" rows="3"></textarea></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitReportModal('${type}','${targetId}')">Submit report</button>
  `);
}
function submitReportModal(type, targetId){
  const reason = document.getElementById('rep-reason').value;
  const details = document.getElementById('rep-details').value;
  submitReport(type, targetId, reason, details);
  closeModal();
}

/* ================= BOOT ================= */
async function boot(){
  document.getElementById('app').innerHTML = `<div class="authwrap"><div class="faint">Loading Nyctophile…</div></div>`;
  await loadDB();
  if(supabaseClient){
    try{
      const {data,error}=await supabaseClient.auth.getSession();
      if(error) throw error;
      if(data.session?.user) await loadSupabaseProfile(data.session.user);
      await loadSupabasePosts();
      if(session?.id) await loadSupabaseGroups();
      if(session?.id){ await loadSupabaseMessages(); await loadSupabaseNotifications(); subscribeToNotifications(); subscribeToMessageUpdates(); subscribeToPresence(); }
      supabaseClient.auth.onAuthStateChange(async (event, authSession)=>{
        if(event==='SIGNED_OUT'){ session=null; if(route.view!=='landing') go('landing'); }
        else if(event==='SIGNED_IN' && authSession?.user && !session){
          try{ await loadSupabaseProfile(authSession.user); await loadSupabasePosts(); await loadSupabaseGroups(); await loadSupabaseMessages(); await loadSupabaseNotifications(); subscribeToNotifications(); subscribeToMessageUpdates(); subscribeToPresence(); go('home'); }
          catch(err){ console.error('Profile load error:',err); toast(err.message); }
        }
      });
    }catch(err){ console.error('Supabase session error:',err); }
  }
  renderApp();
}
boot();
</script>
